# Render's free plan sleeps after 15 idle minutes, which also wipes the SQLite database.
# Pinging the API every 10 minutes keeps the demo awake and its data intact.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 https://typeform-clone-api-okr0.onrender.com/api/health
