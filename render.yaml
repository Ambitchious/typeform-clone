# Render blueprint for the API.
# Free plan: the filesystem is ephemeral, so the SQLite database is recreated (and reseeded
# with the demo forms) whenever the instance restarts or wakes from sleep.
# To keep data: switch `plan` to starter, add the disk below, and set DATABASE_URL to
# sqlite:////var/data/typeform.db and UPLOAD_DIR to /var/data/uploads.
#   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
services:
  - type: web
    name: typeform-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        sync: false # the Vercel URL: https://typeform-clone-ochre-psi.vercel.app
